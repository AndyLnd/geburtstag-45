<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy · 45</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4ecda;
    --ink: #1a1a1a;
    --hot: #e8373c;
    --acid: #d4ff00;
    --blue: #0037ff;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: crosshair;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  /* full-bleed chaos grid */
  .poster {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto auto;
    min-height: 100vh;
    padding: clamp(12px, 4vw, 28px);
    gap: 0;
    position: relative;
  }

  /* ------- THE 45 ------- */
  .age-block {
    grid-column: 1 / 4;
    grid-row: 1 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .age {
    position: relative;
    display: inline-block;
  }

  .age-main {
    font-family: 'Luckiest Guy', cursive;
    font-size: clamp(10rem, 32vw, 22rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.85;
    color: var(--bg);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    animation: pulse 0.6s ease-in-out infinite alternate;
    position: relative;
    z-index: 4;
    display: block;
  }
  @keyframes pulse {
    0% { transform: scale(1) rotate(-1deg); }
    100% { transform: scale(1.04) rotate(1deg); }
  }

  /* chaotic duplicates behind */
  .age-dup {
    position: absolute;
    top: 0; left: 0;
    font-family: 'Luckiest Guy', cursive;
    font-size: clamp(10rem, 32vw, 22rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.85;
    pointer-events: none;
    z-index: 1;
  }
  .age-dup:nth-child(1) { color: var(--hot); transform: translate(-14px, -10px) rotate(-4deg); opacity: 0.7; }
  .age-dup:nth-child(2) { color: var(--blue); transform: translate(16px, 12px) rotate(3deg); opacity: 0.7; }
  .age-dup:nth-child(3) { color: var(--acid); transform: translate(-8px, 22px) rotate(-2deg); opacity: 0.55; }

  /* ------- SCATTERED TEXT ------- */
  .chunk {
    font-weight: 700;
    letter-spacing: -0.02em;
    z-index: 3;
    position: relative;
    font-family: 'Luckiest Guy', cursive;
  }

  /* ANDY */
  .chunk-andy {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    font-size: clamp(1.8rem, 5vw, 3rem);
    align-self: end;
    justify-self: end;
    color: var(--ink);
    margin-right: 8px;
    margin-bottom: 4%;
    transform: rotate(-3deg);
    background: var(--acid);
    display: inline-block;
    padding: 4px 16px;
    width: fit-content;
  }

  /* feiert Geburtstag */
  .chunk-feiert {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
    font-size: clamp(1.8rem, 5vw, 3rem);
    align-self: end;
    justify-self: start;
    text-align: left;
    margin-left: 8px;
    margin-bottom: 4%;
    letter-spacing: -0.01em;
    line-height: 1.2;
    transform: rotate(1.5deg);
    color: var(--blue);
  }

  /* 23. Mai */
  .chunk-date {
    grid-column: 1 / 4;
    grid-row: 3 / 4;
    font-size: clamp(2.8rem, 8vw, 5rem);
    align-self: start;
    justify-self: center;
    color: var(--hot);
    transform: rotate(-4deg);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-top: 4%;
    text-shadow: 4px 4px 0 var(--acid);
  }

  /* 16 Uhr · bei mir */
  .chunk-time {
    grid-column: 1 / 4;
    grid-row: 3 / 4;
    font-size: clamp(1.3rem, 3.5vw, 2rem);
    align-self: end;
    justify-self: center;
    margin-bottom: 0;
    transform: rotate(2deg);
    background: var(--ink);
    color: var(--bg);
    padding: 6px 22px;
    width: fit-content;
  }

  /* Wir freuen uns auf euch */
  .chunk-vibe {
    grid-column: 1 / 4;
    grid-row: 5 / 6;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    align-self: start;
    justify-self: center;
    margin-top: 2%;
    transform: rotate(-1.5deg);
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  /* GIF */
  .chunk-gif {
    grid-column: 1 / 4;
    grid-row: 4 / 5;
    align-self: end;
    justify-self: center;
    margin-bottom: 2%;
    z-index: 5;
  }
  .party-gif {
    width: 120px;
    height: auto;
    display: block;
    image-rendering: auto;
    transform: rotate(2deg);
    transition: transform 0.3s;
  }
  .party-gif:hover { transform: rotate(0deg) scale(1.05); }

  /* scribble lines */
  .scribble {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .scribble svg {
    width: 100%;
    height: 100%;
  }
  .scribble path {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.6;
  }

  /* burst on click */
  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 99;
  }
  .burst-dot {
    position: absolute;
    width: 8px; height: 8px;
    animation: burstOut 0.6s ease-out forwards;
  }
  @keyframes burstOut {
    0%   { transform: translate(0,0) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
  }

  /* scanline overlay */
  .lines-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
  }

  @media (max-width: 640px) {
    .poster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 16px 24px 32px;
      min-height: 100vh;
      justify-content: center;
    }

    .age-block { order: -1; margin-bottom: 4px; }

    .age-main,
    .age-dup {
      font-size: clamp(5rem, 18vw, 8rem) !important;
    }
    .age-main { -webkit-text-stroke: 2px var(--ink); }

    /* ANDY + feiert Geburtstag — nah beieinander unter der 45 */
    .chunk-andy {
      font-size: 1.3rem;
      margin: 4px 0 0;
      transform: rotate(-2deg);
      padding: 3px 12px;
      align-self: center;
      text-align: center;
    }
    .chunk-feiert {
      font-size: 1.3rem;
      margin: 4px 0 0;
      text-align: center;
      transform: rotate(1deg);
      align-self: center;
      line-height: 1.2;
    }

    /* Datum + Uhrzeit + Vibe — enger Cluster */
    .chunk-date {
      font-size: 2rem;
      margin: 18px 0 0;
      transform: rotate(-2deg);
      align-self: center;
    }
    .chunk-time {
      font-size: 1.1rem;
      margin: 6px 0 0;
      transform: rotate(1.5deg);
      align-self: center;
    }
    .chunk-gif {
      margin: 8px 0 0;
      align-self: center;
      order: 0;
    }
    .chunk-gif .party-gif {
      width: 90px;
    }
    .chunk-vibe {
      font-size: 0.95rem;
      margin: 8px 0 0;
      transform: rotate(-1deg);
      align-self: center;
    }
  }
</style>
</head>
<body>

<div class="poster">

  <div class="age-block">
    <div class="age">
      <span class="age-dup">45</span>
      <span class="age-dup">45</span>
      <span class="age-dup">45</span>
      <span class="age-main">45</span>
    </div>
  </div>

  <div class="chunk chunk-andy">ANDY</div>
  <div class="chunk chunk-feiert">feiert<br>Geburtstag</div>
  <div class="chunk chunk-date">23. Mai</div>
  <div class="chunk chunk-time">16 Uhr &nbsp;·&nbsp; bei mir</div>

  <div class="chunk chunk-gif">
    <img src="burzdei.gif" alt="Burzdei" class="party-gif">
  </div>

  <div class="chunk chunk-vibe">Sagt Bescheid, ob ihr dabei seid.</div>

</div>

<div class="lines-overlay"></div>

<script>
// burst
document.addEventListener('click', (e) => {
  const b = document.createElement('div');
  b.className = 'burst';
  b.style.left = e.clientX + 'px';
  b.style.top = e.clientY + 'px';
  const colors = ['#e8373c', '#0037ff', '#d4ff00', '#1a1a1a'];
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.className = 'burst-dot';
    const angle = (Math.PI * 2 * i) / 20;
    const dist = 20 + Math.random() * 70;
    d.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    d.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.appendChild(d);
  }
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 700);
});
</script>
</body>
</html>
